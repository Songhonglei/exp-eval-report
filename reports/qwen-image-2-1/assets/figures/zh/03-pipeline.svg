<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="350" viewBox="0 0 1400 350"><rect width="1400" height="350" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#506164"/></marker></defs><g font-family="system-ui, sans-serif" fill="#233332"><rect x="30" y="55" width="220" height="170" rx="14" fill="#EEF1F0" stroke="#CCD5D3"/><text x="140" y="96" text-anchor="middle" font-size="23" font-weight="600">输入</text><text x="140" y="139" text-anchor="middle" font-size="18">文本</text><text x="140" y="171" text-anchor="middle" font-size="18">可选参考图</text><path d="M255,140 H300" stroke="#506164" stroke-width="2.5" marker-end="url(#a)"/><rect x="310" y="55" width="220" height="170" rx="14" fill="#E7F0EE" stroke="#CCD5D3"/><text x="420" y="96" text-anchor="middle" font-size="23" font-weight="600">CPU 条件编码</text><text x="420" y="139" text-anchor="middle" font-size="18">INT8 文本编码器</text><text x="420" y="171" text-anchor="middle" font-size="18">FP32 参考 VAE 编码¹</text><path d="M535,140 H580" stroke="#506164" stroke-width="2.5" marker-end="url(#a)"/><rect x="590" y="55" width="220" height="170" rx="14" fill="#E6EDF5" stroke="#CCD5D3"/><text x="700" y="96" text-anchor="middle" font-size="23" font-weight="600">MPS 扩散采样</text><text x="700" y="139" text-anchor="middle" font-size="18">Q4 或 Q6 GGUF 主体</text><text x="700" y="171" text-anchor="middle" font-size="18">逐步去噪</text><path d="M815,140 H860" stroke="#506164" stroke-width="2.5" marker-end="url(#a)"/><rect x="870" y="55" width="220" height="170" rx="14" fill="#E7F0EE" stroke="#CCD5D3"/><text x="980" y="96" text-anchor="middle" font-size="23" font-weight="600">CPU 解码</text><text x="980" y="139" text-anchor="middle" font-size="18">FP32 VAE</text><text x="980" y="171" text-anchor="middle" font-size="18">latent 转为图像</text><path d="M1095,140 H1140" stroke="#506164" stroke-width="2.5" marker-end="url(#a)"/><rect x="1150" y="55" width="220" height="170" rx="14" fill="#EEF1F0" stroke="#CCD5D3"/><text x="1260" y="96" text-anchor="middle" font-size="23" font-weight="600">输出验收</text><text x="1260" y="139" text-anchor="middle" font-size="18">保存图像</text><text x="1260" y="171" text-anchor="middle" font-size="18">检查质量与任务目标</text><text x="35" y="275" font-size="19">¹ 参考 VAE 编码仅用于图片编辑；文生图不执行参考编码。</text><text x="35" y="311" font-size="19" fill="#5A6968">CPU 与 GPU 共用 48GB 统一内存；按设备分工不等于拥有两套内存容量。</text></g></svg>